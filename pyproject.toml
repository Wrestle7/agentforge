[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-harness"
version = "0.1.0"
description = "Evidence-driven LangGraph task harness with reproducible evaluation"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4", "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1", "sqlalchemy>=2,<3", "mcp>=1.18,<2",
  "httpx>=0.28,<1", "pydantic>=2.11,<3", "pydantic-settings>=2,<3",
  "langsmith>=0.4,<1", "jsonschema>=4,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
semantic = ["fastembed>=0.8.1,<0.9"]

[project.scripts]
agentforge = "agentforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires AF_DATABASE_URL PostgreSQL", "integration: subprocess/network integration"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
